version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      # Lado esquerdo: Config do MySQL | Lado direito: Variável que vem do .env
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http web:8000  # "web" é o nome do container do seu Python
    environment:
      NGROK_AUTHTOKEN: 36IobOoQgxPL7GSlRIvBwtp3Ptt_39Nedr5FUVvemapDWe1F
    ports:
      - 4040:4040 # Libera o painel de controle
    depends_on:
      - web

volumes:
  mysql_data: