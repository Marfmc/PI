<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Contratante - ConstruFácil</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; margin: 0; }
        
        /* NAVBAR PADRONIZADA (Branca) */
        .navbar { 
            background: #fff; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: relative;
        }
        .logo { color: #013E46; font-weight: bold; font-size: 1.2rem; }
        
        .role-switch {
            background: #eee; 
            border-radius: 20px; 
            padding: 5px; 
            display: flex; 
            align-items: center; 
            cursor: pointer;

            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .role-option { padding: 5px 15px; border-radius: 15px; font-size: 0.9rem; color: #777; transition: 0.3s; }
        .role-option:hover { background: #e0e0e0; }
        .role-option.active { background: #013E46; color: white; font-weight: bold; }
        
        .content { padding: 40px; text-align: center; }
        a.logout-link { color: #d9534f; text-decoration: none; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">ConstruFácil</div>
        
        <div class="role-switch">
            <div class="role-option active">Contratante</div>
            <div class="role-option" onclick="mudarModo('prestador')">Prestador</div>
        </div>

        <div>
            <span id="u-email">...</span> | <a href="#" onclick="logout()" class="logout-link">Sair</a>
        </div>
    </div>

    <div class="content">
        <h1>Área do Contratante</h1>
        <p>Busque por pedreiros, eletricistas e outros profissionais.</p>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = "login.html";

        let currentUser = null;

        async function loadUser() {
            const response = await fetch('/me', { headers: { 'Authorization': `Bearer ${token}` }});
            if (response.ok) {
                currentUser = await response.json();
                document.getElementById('u-email').innerText = currentUser.email;
            } else {
                logout();
            }
        }

        function mudarModo(modo) {
            if (modo === 'prestador') {
                if (currentUser.is_provider_setup) {
                    window.location.href = "dash_prestador.html";
                } else {
                    if(confirm("Você precisa completar seu perfil profissional antes! Vamos lá?")) {
                        window.location.href = "setup_prestador.html"; 
                    }
                }
            }
        }

        function logout() { localStorage.removeItem('token'); window.location.href = "login.html"; }
        loadUser();
    </script>
</body>
</html>
