<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ConstruFácil - Home</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #013E46; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .hero { text-align: center; padding: 100px 20px; background: white; }
        h1 { color: #54A858; font-size: 3rem; margin-bottom: 10px; }
        .btn { padding: 15px 30px; border-radius: 5px; text-decoration: none; font-weight: bold; margin: 10px; display: inline-block; cursor: pointer; }
        .btn-primary { background: #54A858; color: white; }
        .btn-outline { border: 2px solid #54A858; color: #54A858; }
        .top-nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ConstruFácil</div>
        <div class="top-nav" id="nav-links">
            <a href="login.html">Entrar / Criar Conta</a>
        </div>
    </header>

    <div class="hero">
        <h1>Conectando quem precisa<br>com quem sabe construir.</h1>
        <p>A plataforma completa para serviços rápidos e seguros.</p>
        <br>
        <div id="action-buttons">
            <a href="login.html" class="btn btn-primary">Quero Contratar</a>
            <a href="login.html" class="btn btn-outline">Sou Profissional</a>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        if (token) {
            document.getElementById('nav-links').innerHTML = `<a href="#" onclick="logout()">Sair</a>`;
            document.getElementById('action-buttons').innerHTML = `
                <p>Olá! Você já está logado.</p>
                <button onclick="checkRedirect()" class="btn btn-primary">Acessar Meu Painel</button>
            `;
        }

        async function checkRedirect() {
            try {
                const response = await fetch('/me', { headers: { 'Authorization': `Bearer ${token}` }});
                if (response.ok) {
                    window.location.href = "dashboard.html"; 
                } else {
                    localStorage.removeItem('token');
                    window.location.href = "login.html";
                }
            } catch(e) { console.error(e); }
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
</body>
</html>
