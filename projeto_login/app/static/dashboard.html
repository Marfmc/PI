<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Seguro</title>
    <style>
        :root { --bg: #f4f4f4; --primary: #54A858; --dark: #013E46; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        
        .card { 
            background: white; width: 500px; padding: 40px; border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; 
        }

        h1 { color: var(--dark); margin-bottom: 10px; }
        p { color: #666; font-size: 1.1rem; }
        
        .user-info {
            background: #eef; padding: 15px; border-radius: 5px; 
            margin: 20px 0; border-left: 4px solid var(--primary); text-align: left;
        }

        button {
            background: #d9534f; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-size: 1rem;
        }
        button:hover { background: #c9302c; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Área Restrita</h1>
        <p>Bem-vindo ao sistema.</p>

        <div class="user-info">
            <p><strong>Status:</strong> <span style="color:green">● Online</span></p>
            <p><strong>ID:</strong> <span id="u-id">...</span></p>
            <p><strong>Email:</strong> <span id="u-email">Carregando...</span></p>
        </div>

        <button onclick="logout()">Sair do Sistema</button>
    </div>

    <script>
        // 1. SEGURANÇA: Verificar Token imediatamente
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "index.html"; // Chuta de volta pro login
        }

        // 2. BUSCAR DADOS DO BACKEND
        async function loadProfile() {
            try {
                const response = await fetch('/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('u-email').innerText = user.email;
                    document.getElementById('u-id').innerText = "#" + user.id;
                } else {
                    // Token expirou ou é falso
                    logout();
                }
            } catch (error) {
                console.error(error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = "index.html";
        }

        // Inicia a busca
        loadProfile();
    </script>
</body>
</html>
